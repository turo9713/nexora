name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement runtime/requirements.txt
      - name: Prepare release-compatible workspace path
        run: |
          sudo mkdir -p /workspace
          sudo ln -s "${GITHUB_WORKSPACE}" /workspace/nexora
      - name: Unit and integration tests
        env:
          PYTHONPATH: /workspace
        run: python -m pytest -q tests integrations/telegram_runtime/tests
      - name: Offline demo
        run: python examples/demo_content_workflow.py
