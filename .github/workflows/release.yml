name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare release-compatible workspace path
        run: |
          sudo mkdir -p /workspace
          sudo ln -s "${GITHUB_WORKSPACE}" /workspace/nexora
      - name: Verify source and dependencies
        env:
          PYTHONPATH: /workspace
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python -m pip install --requirement runtime/requirements.txt pip-audit
          python -m pytest -q tests dashboard/tests integrations/telegram_runtime/tests
          python examples/demo_content_workflow.py
          python -m pip_audit --requirement requirements-release.txt
          bash scripts/secret-scan.sh
          python scripts/check-release-permissions.py
      - uses: docker/setup-buildx-action@v3
      - name: Build role images without publishing
        run: |
          for role in runtime dashboard api; do
            docker build --build-arg "NEXORA_SERVICE=$role" \
              --tag "nexora/$role:${GITHUB_REF_NAME#v}" --file Dockerfile.release .
          done
      - name: Build source artifact
        run: bash scripts/build-release-archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-${{ github.ref_name }}-source
          path: |
            release-artifacts/nexora-*.tar.gz
            release-artifacts/nexora-*.tar.gz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Nexora $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes-$GITHUB_REF_NAME.md" \
            release-artifacts/nexora-*.tar.gz \
            release-artifacts/nexora-*.tar.gz.sha256
