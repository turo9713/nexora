name: Release

on:
  push:
    tags:
      - v2.0.0

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify source and dependencies
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python -m pip install --requirement runtime/requirements.txt pip-audit
          python -m pytest -q
          python -m pip_audit --requirement requirements-release.txt
          bash scripts/secret-scan.sh
          python scripts/check-release-permissions.py
      - uses: docker/setup-buildx-action@v3
      - name: Build role images without publishing
        run: |
          for role in runtime dashboard api; do
            docker build --build-arg "NEXORA_SERVICE=$role" \
              --tag "nexora/$role:2.0.0" --file Dockerfile.release .
          done
      - name: Build source artifact
        run: bash scripts/build-release-archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-2.0.0-source
          path: |
            release-artifacts/nexora-2.0.0.tar.gz
            release-artifacts/nexora-2.0.0.tar.gz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.0.0 --verify-tag --latest \
            --title "Nexora v2.0.0" \
            --notes-file docs/release-notes-v2.0.0.md \
            release-artifacts/nexora-2.0.0.tar.gz \
            release-artifacts/nexora-2.0.0.tar.gz.sha256
