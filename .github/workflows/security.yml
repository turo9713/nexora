name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository and history secret scan
        run: bash scripts/secret-scan.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements-release.txt
      - name: Compose policy
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/check-release-permissions.py
