openapi: 3.1.0
info:
  title: Nexora Public API
  version: 1.7.0
servers:
  - url: https://127.0.0.1:18881/api/v1
    description: Localhost-only production staging endpoint
security:
  - bearerAuth: []
paths:
  /creators/{id}:
    get:
      operationId: getCreator
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^CRT-[A-F0-9]{12}$"}}
      responses:
        "200": {description: Sanitized public creator profile}
        "404": {description: Creator not found or unavailable}
  /creator/packages:
    get:
      operationId: listOwnCreatorPackages
      responses:
        "200": {description: API-key-owner package versions}
  /creator/analytics:
    get:
      operationId: getOwnCreatorAnalytics
      responses:
        "200": {description: API-key-owner creator analytics}
  /tasks:
    get:
      operationId: listTasks
      parameters:
        - {name: workspace_id, in: query, required: false, schema: {type: string, pattern: "^WS-[A-F0-9]{12}$"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Safe owner- or workspace-scoped read-only task inventory}
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskCreate"}
      responses:
        "202": {description: Task queued}
  /tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: workspace_id, in: query, required: false, schema: {type: string, pattern: "^WS-[A-F0-9]{12}$"}}
      responses:
        "200": {description: Safe read-only task details from the existing runtime state}
        "404": {description: Task not found or unavailable}
  /tasks/{id}/events:
    get:
      operationId: listTaskEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: workspace_id, in: query, required: false, schema: {type: string, pattern: "^WS-[A-F0-9]{12}$"}}
      responses:
        "200": {description: Sanitized read-only lifecycle events for an accessible task}
        "404": {description: Task or workspace not found or unavailable}
  /agents:
    get:
      operationId: listAgents
      parameters:
        - {name: workspace_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Safe owner- or workspace-scoped Agent Control Center inventory}
  /agents/{id}:
    get:
      operationId: getAgent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9-]{1,62}$"}}
        - {name: workspace_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Safe read-only agent details and owner-scoped activity summary}
        "404": {description: Agent or workspace not found or unavailable}
  /skills:
    get:
      operationId: listSkills
      responses:
        "200": {description: Safe skill states}
  /templates:
    get:
      operationId: listTemplates
      responses:
        "200": {description: Validated workflow templates}
  /templates/{id}:
    get:
      operationId: getTemplate
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Safe template manifest}
        "404": {description: Template not found or unavailable}
    post:
      operationId: installTemplate
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Installed or waiting for approval}
  /playground/examples:
    get:
      operationId: listPlaygroundExamples
      responses:
        "200": {description: Sandbox-only example catalogue}
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        "200": {description: Organizations visible to the authenticated user}
  /workspaces:
    get:
      operationId: listWorkspaces
      parameters:
        - {name: organization_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Membership-scoped workspaces}
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceCreate"}
      responses:
        "201": {description: Workspace created after RBAC and policy checks}
  /members:
    get:
      operationId: listMembers
      parameters:
        - {name: workspace_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Workspace members visible to authorized roles}
  /invite:
    post:
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberInvite"}
      responses:
        "201": {description: Member invited using a matching one-time approval}
  /knowledge:
    get:
      operationId: listKnowledge
      parameters:
        - {name: workspace_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Role-filtered workspace knowledge}
    post:
      operationId: addKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KnowledgeCreate"}
      responses:
        "201": {description: Sanitized workspace knowledge document created}
  /plans:
    get:
      operationId: listPlans
      responses:
        "200": {description: Active plans and public limits/features}
  /subscription:
    get:
      operationId: getSubscription
      parameters:
        - {name: organization_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Tenant-scoped current subscription}
        "404": {description: Organization not found or unavailable}
  /usage:
    get:
      operationId: getUsage
      parameters:
        - {name: organization_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Tenant-scoped monthly usage summary}
  /limits:
    get:
      operationId: getLimits
      parameters:
        - {name: organization_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Effective plan limits and current resource counters}
  /webhooks:
    get:
      operationId: listWebhooks
      responses:
        "200": {description: Owner-scoped webhooks}
    post:
      operationId: requestWebhook
      responses:
        "202": {description: Waiting for approval}
  /marketplace:
    get:
      operationId: listMarketplace
      parameters:
        - {name: search, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: category, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: type, in: query, required: false, schema: {type: string, enum: [AGENT, SKILL, TEMPLATE, INTEGRATION]}}
      responses:
        "200": {description: Published, security-validated marketplace items}
  /marketplace/{id}:
    get:
      operationId: getMarketplaceItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}}
      responses:
        "200": {description: Safe item details and declarative manifest}
        "404": {description: Item not found or unavailable}
  /marketplace/{id}/install:
    post:
      operationId: installMarketplaceItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: Installed in authorized workspace}
        "202": {description: Waiting for approval}
  /marketplace/publish:
    post:
      operationId: publishMarketplaceItem
      responses:
        "201": {description: Declarative package validated and published}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nx_live
  schemas:
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, agent, skill]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        agent: {type: string, pattern: "^[a-z][a-z0-9-]{1,63}$"}
        skill: {type: string, pattern: "^[a-z][a-z0-9-]{1,63}$"}
        workspace_id: {type: string, pattern: "^WS-[A-F0-9]{12}$"}
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [organization_id, name]
      properties:
        organization_id: {type: string, pattern: "^ORG-[A-F0-9]{12}$"}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 1000}
    MemberInvite:
      type: object
      additionalProperties: false
      required: [workspace_id, email_hash, display_name, role, approval_id]
      properties:
        workspace_id: {type: string, pattern: "^WS-[A-F0-9]{12}$"}
        email_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
        display_name: {type: string, minLength: 2, maxLength: 80}
        role: {type: string, enum: [ADMIN, MANAGER, OPERATOR, VIEWER]}
        approval_id: {type: string, pattern: "^APR-[A-Za-z0-9-]{6,64}$"}
    KnowledgeCreate:
      type: object
      additionalProperties: false
      required: [workspace_id, name, type, content]
      properties:
        workspace_id: {type: string, pattern: "^WS-[A-F0-9]{12}$"}
        name: {type: string, minLength: 2, maxLength: 120}
        type: {type: string, enum: [text, markdown, policy, template]}
        access_level: {type: string, enum: [TEAM, MANAGERS, ADMINS]}
        content: {type: string, minLength: 1, maxLength: 100000}
