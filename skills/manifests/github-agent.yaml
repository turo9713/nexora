id: github-agent
name: GitHub Agent
version: 1.0.0
description: Read-only анализ GitHub-репозиториев, кода и pull requests.
author: Nexora
category: development
agent: developer
permissions:
  filesystem:
    scope: [workspace]
    mode: read_only
  network:
    mode: github_api_only
  shell:
    enabled: false
  production:
    enabled: false
  write: false
risk:
  level: medium
tools: [repository_analysis, github_read, reporting]
security:
  sandbox:
    enabled: true
approval:
  required: false
compatibility:
  min_platform: 1.8.0
status: ACTIVE
