id: accessibility-review
name: Accessibility Review
version: 1.0.0
description: Проверка интерфейсов и документации на соответствие основным требованиям WCAG без браузерных действий.
author: Nexora
category: development
agent: developer
permissions:
  filesystem:
    scope: [workspace]
    mode: read_only
  network:
    mode: none
  shell:
    enabled: false
  production:
    enabled: false
risk:
  level: low
tools: [repository_analysis, reporting]
security:
  sandbox:
    enabled: true
approval:
  required: false
compatibility:
  min_platform: 1.7.0
status: DISABLED
