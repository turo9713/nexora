id: e2e-testing-patterns
name: E2E Testing Patterns
version: 1.0.0
description: Design stable end-to-end scenarios for critical user journeys without browser, network, or command execution.
author: Nexora
category: development
agent: qa
permissions:
  filesystem:
    scope: [workspace]
    mode: read_only
  network:
    mode: none
  shell:
    enabled: false
  production:
    enabled: false
risk:
  level: low
tools: [repository_analysis, reporting]
security:
  sandbox:
    enabled: true
approval:
  required: false
compatibility:
  min_platform: 1.7.0
status: DISABLED
