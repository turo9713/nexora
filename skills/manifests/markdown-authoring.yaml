id: markdown-authoring
name: Markdown Authoring
version: 1.0.0
description: Draft portable Markdown and MDX from supplied workspace material without publication or external conversion.
author: Nexora
category: content
agent: content
permissions:
  filesystem:
    scope: [workspace]
    mode: read_only
  network:
    mode: none
  shell:
    enabled: false
  production:
    enabled: false
risk:
  level: low
tools: [text_generation, reporting]
security:
  sandbox:
    enabled: true
approval:
  required: false
compatibility:
  min_platform: 1.7.0
status: DISABLED
